[package]
name = "redis-monitor"
version = "0.1.2"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
arcstr = "1.2.0"
bitflags = "2.13.1"
bytes = "1.12.1"
clap = { version = "4.6.5", features = ["derive", "wrap_help"] }
clap_complete = "4.6.8"
colored = "3.1.1"
config = { version = "0.15.25", features = ["toml"] }
csv = "1.4.0"
flume = "0.12.0"
futures = "0.3.33"
lexical-core = "1.0.6"
memchr = "2.8.3"
nom = "8.0.0"
rand = "0.10.2"
redis = { version = "1.5.0", default-features = false, features = [
  "aio",
  "connection-manager",
  "tokio-comp",
  "tls-rustls",
  "tokio-rustls-comp",
  # optional: bake in Mozilla roots instead of using OS store:
  # "tls-rustls-webpki-roots",
] }
regex = "1.13.1"
rustls = "0.23.43"
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
serde_php = "0.5.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
url = "2.5.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
panic = "abort"

[profile.release-static]
inherits = "release"
